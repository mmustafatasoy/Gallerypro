# Gallerypro APK derlemesi (GitHub Actions).
# main ve asama-* dallarına her gönderimde çalışır; elle de başlatılabilir (Actions › APK › Run workflow).
# Depo herkese açık olduğu için derleme dakikası ücretsiz ve sınırsızdır.
name: APK

on:
  push:
    branches: [main, "asama-*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testler ve APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle sürümü
        id: gradle
        run: echo "version=$(sed -n 's/.*gradle-\([0-9.]*\)-bin\.zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties)" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Android lisansları
        run: bash scripts/accept-android-licenses.sh

      - name: Inter yazı tipi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-fonttools python3-brotli > /dev/null
          bash scripts/fetch-fonts.sh

      # Sabit deneme imza anahtarı (debug.keystore): yeni APK eskisinin üstüne kurulabilsin (gizli değildir, şifresi standart "android").
      - name: Debug imza anahtarı
        run: mkdir -p ~/.android && base64 -d scripts/debug-keystore.b64 > ~/.android/debug.keystore

      # Termux'ta oluşturulan özel anahtar 4 Secret ile gönderilir. Eksikse kesin hata.
      - name: Özel imza anahtarı doğrulama
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          count=0
          for k in RELEASE_KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -n "${!k:-}" ]; then count=$((count + 1)); fi
          done
          if [ "$count" -gt 0 ] && [ "$count" -ne 4 ]; then
            echo "::error::Dört yayın imza Secret'ından biri eksik."
            exit 1
          fi
          if [ "$count" -eq 4 ]; then
            printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > app/release.jks
            test -s app/release.jks
            echo "SIGN_MODE=private" >> "$GITHUB_ENV"
          else
            echo "SIGN_MODE=test" >> "$GITHUB_ENV"
            echo "::warning::Test imzası, özel yayın anahtarı henüz eklenmedi."
          fi

      # Cümleyle arama (CLIP) modelleri depoda değil, "modeller" sürümündedir (Modeller iş akışı üretir).
      # Yoksa APK yine derlenir; uygulamada cümleyle arama kapalı kalır.
      - name: Cümleyle arama modelleri
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets/models app/src/test/resources/clip
          ok=0
          for i in 1 2 3 4 5 6; do
            if gh release download modeller -D app/src/main/assets/models -p "clip_image.tflite" -p "clip_text.tflite" -p "clip_text_vocab.txt" --clobber; then ok=1; break; fi
            sleep 30
          done
          if [ "$ok" = 1 ]; then
            gh release download modeller -D app/src/test/resources/clip -p "clip_tokens_test.json" --clobber || true
            mkdir -p app/src/main/assets/licenses && cp scripts/models/NOTICE.txt app/src/main/assets/licenses/clip-models.txt
            ls -la app/src/main/assets/models
          else
            echo "::warning::Modeller henüz yok; APK cümleyle arama olmadan derleniyor."
          fi

      # Yerler (fotoğrafın çekildiği şehir): GeoNames şehir listesi (CC BY 4.0), depoya konmaz.
      # İndirilemezse APK yine derlenir; uygulamada yer adları kapalı kalır.
      # Kişiler için resmi OpenCV Zoo modelleri. Model ağırlıkları Git'e eklenmez.
      # GitHub Actions Android derlemesinde APK assets/face içine paketlenir.
      - name: Yüz modelleri YuNet ve SFace FP32
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/face app/src/main/assets/licenses
          # Github raw LFS pointer dosyası (131 bayt) döndürür.
          # Hugging Face'deki resmi opencv/opencv_zoo aynası gerçek ONNX ağırlıklarını verir.
          BASE="https://huggingface.co/opencv/opencv_zoo/resolve/main/models"
          curl -fL --retry 3 --connect-timeout 30 \
            "$BASE/face_detection_yunet/face_detection_yunet_2023mar.onnx?download=true" \
            -o app/src/main/assets/face/face_detection_yunet_2023mar.onnx
          curl -fL --retry 3 --connect-timeout 30 \
            "$BASE/face_recognition_sface/face_recognition_sface_2021dec.onnx?download=true" \
            -o app/src/main/assets/face/face_recognition_sface_2021dec.onnx
          test "$(stat -c%s app/src/main/assets/face/face_detection_yunet_2023mar.onnx)" -gt 150000
          test "$(stat -c%s app/src/main/assets/face/face_recognition_sface_2021dec.onnx)" -gt 30000000
          LICENSE_BASE="https://raw.githubusercontent.com/opencv/opencv_zoo/main/models"
          curl -fL --retry 3 "$LICENSE_BASE/face_recognition_sface/LICENSE" \
            -o app/src/main/assets/licenses/sface-apache-2.0.txt
          curl -fL --retry 3 "$LICENSE_BASE/face_detection_yunet/LICENSE" \
            -o app/src/main/assets/licenses/yunet-mit.txt
          sha256sum app/src/main/assets/face/*.onnx

      - name: Yer adları (GeoNames)
        run: |
          mkdir -p /tmp/geo app/src/main/assets/places app/src/main/assets/licenses
          if curl -sSfL --retry 3 https://download.geonames.org/export/dump/cities5000.zip -o /tmp/geo/cities.zip && \
             curl -sSfL --retry 3 https://download.geonames.org/export/dump/admin1CodesASCII.txt -o /tmp/geo/admin1.txt && \
             unzip -o -q /tmp/geo/cities.zip -d /tmp/geo && \
             python3 scripts/places/build_cities.py /tmp/geo/cities5000.txt /tmp/geo/admin1.txt app/src/main/assets/places/cities.tsv; then
            cp scripts/places/NOTICE.txt app/src/main/assets/licenses/geonames.txt
            ls -la app/src/main/assets/places
          else
            rm -f app/src/main/assets/places/cities.tsv
            echo "::warning::GeoNames indirilemedi; APK yer adları olmadan derleniyor."
          fi

      - name: Testler ve güncellenebilir doğrudan APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon testDebugUnitTest assembleDirect

      - name: Test özeti
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = skipped = failed = 0
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(f).getroot()
              total += int(root.get("tests", 0)); failed += int(root.get("failures", 0)) + int(root.get("errors", 0))
              for case in root.iter("testcase"):
                  if case.find("skipped") is not None:
                      skipped += 1
                      print("atlandı:", case.get("classname"), case.get("name"))
          print(f"test: {total}, hata: {failed}, atlanan: {skipped}")
          PY

      - name: APK adı, imza ve otomatik güncelleme manifesti
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/direct/app-direct.apk Gallerypro.apk
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n1)"
          test -x "$APK_SIGNER"
          test -x "$AAPT"
          "$APK_SIGNER" verify --print-certs Gallerypro.apk > /tmp/gallerypro-cert.txt
          export CERT_HASH="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/gallerypro-cert.txt | head -n1)"
          test "${#CERT_HASH}" -eq 64
          "$AAPT" dump permissions Gallerypro.apk | grep -F 'android.permission.INTERNET'
          "$AAPT" dump permissions Gallerypro.apk | grep -F 'android.permission.REQUEST_INSTALL_PACKAGES'
          export CODE="$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)"
          export VERSION="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          test -n "$CODE"
          test -n "$VERSION"
          python3 - <<'PY'
          import os, json, hashlib
          from pathlib import Path
          apk=Path('Gallerypro.apk')
          update={
            'packageName': 'com.atasoy.gallerypro',
            'versionCode': int(os.environ['CODE']),
            'versionName': os.environ['VERSION'],
            'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
            'signerSha256': os.environ['CERT_HASH'].lower(),
            'sizeBytes': apk.stat().st_size,
            'signMode': os.environ['SIGN_MODE']
          }
          Path('Gallerypro-update.json').write_text(
            json.dumps(update, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          print('Güncelleme paketi:', update['versionName'], update['signMode'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: Gallerypro-apk
          path: |
            Gallerypro.apk
            Gallerypro-update.json

      # Telefondan tek dokunuşla indirmek için: main → "son-surum", aşama dalları → dal adıyla bir ön sürüm.
      - name: İndirme bağlantısı (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then TAG=son-surum; else TAG="$GITHUB_REF_NAME"; fi
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" Gallerypro.apk Gallerypro-update.json --target "$GITHUB_SHA" --prerelease \
            --title "Gallerypro $VERSION ($GITHUB_REF_NAME)" \
            --notes "Güncellenebilir doğrudan APK. İmza: $SIGN_MODE. Özel anahtar eklenmediyse test amaçlıdır. Derleme: $GITHUB_SHA."
      
      # Her başarılı aşamada indirilebilir tam kaynak ZIP'i ve SHA-256 doğrulaması.
      - name: Tam kaynak ZIP yedeği
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gallerypro-source"
          mkdir -p "$ROOT/Gallerypro"
          git archive HEAD | tar -x -C "$ROOT/Gallerypro"
          mkdir -p "$ROOT/Gallerypro/app/src/main/res/font"
          cp -a app/src/main/res/font/. "$ROOT/Gallerypro/app/src/main/res/font/"
          if [ -d app/src/main/assets/licenses ]; then
            mkdir -p "$ROOT/Gallerypro/app/src/main/assets/licenses"
            cp -a app/src/main/assets/licenses/. "$ROOT/Gallerypro/app/src/main/assets/licenses/"
          fi
          git bundle create "$ROOT/Gallerypro/Gallerypro-tum-gecmis.bundle" --all
          cp DEVAM-NOTU.md "$ROOT/DEVAM-NOTU.md"
          (cd "$ROOT" && zip -qr "$GITHUB_WORKSPACE/Gallerypro-kaynak.zip" Gallerypro DEVAM-NOTU.md)
          unzip -tqq Gallerypro-kaynak.zip
          sha256sum Gallerypro-kaynak.zip > Gallerypro-kaynak.zip.sha256
          ls -lh Gallerypro-kaynak.zip Gallerypro-kaynak.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Gallerypro-tam-kaynak
          path: |
            Gallerypro-kaynak.zip
            Gallerypro-kaynak.zip.sha256

      - name: ZIP yedeğini Releases'a ekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then TAG=son-surum; else TAG="$GITHUB_REF_NAME"; fi
          gh release upload "$TAG" Gallerypro-kaynak.zip Gallerypro-kaynak.zip.sha256 --clobber

