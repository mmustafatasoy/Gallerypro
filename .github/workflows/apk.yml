# Gallerypro APK derlemesi (GitHub Actions).
# main ve asama-* dallarına her gönderimde çalışır; elle de başlatılabilir (Actions › APK › Run workflow).
# Depo herkese açık olduğu için derleme dakikası ücretsiz ve sınırsızdır.
name: APK

on:
  push:
    branches: [main, "asama-*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testler ve APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle sürümü
        id: gradle
        run: echo "version=$(sed -n 's/.*gradle-\([0-9.]*\)-bin\.zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties)" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Android lisansları
        run: bash scripts/accept-android-licenses.sh

      - name: Inter yazı tipi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-fonttools python3-brotli > /dev/null
          bash scripts/fetch-fonts.sh

      # Sabit deneme imza anahtarı (debug.keystore): yeni APK eskisinin üstüne kurulabilsin (gizli değildir, şifresi standart "android").
      - name: Debug imza anahtarı
        run: mkdir -p ~/.android && base64 -d scripts/debug-keystore.b64 > ~/.android/debug.keystore

      # Cümleyle arama (CLIP) modelleri depoda değil, "modeller" sürümündedir (Modeller iş akışı üretir).
      # Yoksa APK yine derlenir; uygulamada cümleyle arama kapalı kalır.
      - name: Cümleyle arama modelleri
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets/models app/src/test/resources/clip
          ok=0
          for i in 1 2 3 4 5 6; do
            if gh release download modeller -D app/src/main/assets/models -p "clip_image.tflite" -p "clip_text.tflite" -p "clip_text_vocab.txt" --clobber; then ok=1; break; fi
            sleep 30
          done
          if [ "$ok" = 1 ]; then
            gh release download modeller -D app/src/test/resources/clip -p "clip_tokens_test.json" --clobber || true
            mkdir -p app/src/main/assets/licenses && cp scripts/models/NOTICE.txt app/src/main/assets/licenses/clip-models.txt
            ls -la app/src/main/assets/models
          else
            echo "::warning::Modeller henüz yok; APK cümleyle arama olmadan derleniyor."
          fi

      - name: Testler ve APK
        run: gradle --no-daemon testDebugUnitTest assembleRelease

      - name: Test özeti
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = skipped = failed = 0
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(f).getroot()
              total += int(root.get("tests", 0)); failed += int(root.get("failures", 0)) + int(root.get("errors", 0))
              for case in root.iter("testcase"):
                  if case.find("skipped") is not None:
                      skipped += 1
                      print("atlandı:", case.get("classname"), case.get("name"))
          print(f"test: {total}, hata: {failed}, atlanan: {skipped}")
          PY

      - name: APK adı
        run: cp app/build/outputs/apk/release/app-release.apk Gallerypro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Gallerypro-apk
          path: Gallerypro.apk

      # Telefondan tek dokunuşla indirmek için: main → "son-surum", aşama dalları → dal adıyla bir ön sürüm.
      - name: İndirme bağlantısı (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then TAG=son-surum; else TAG="$GITHUB_REF_NAME"; fi
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" Gallerypro.apk --target "$GITHUB_SHA" --prerelease \
            --title "Gallerypro $VERSION ($GITHUB_REF_NAME)" \
            --notes "Hızlı (release) APK, sabit deneme anahtarıyla imzalı. Derleme: $GITHUB_SHA. Doğrudan indirme: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Gallerypro.apk"
