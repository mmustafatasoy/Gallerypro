# Cümleyle arama modellerini hazırlar (PyTorch → LiteRT, int8) ve "modeller" sürümüne yükler.
# Modeller depoya konmaz; APK derlemesi bu sürümden indirir. Elle de başlatılabilir.
name: Modeller

on:
  push:
    branches: [main, "asama-*"]
    paths: ["scripts/models/**", ".github/workflows/models.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    name: CLIP modellerini çevir
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Araçlar
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4,<2.13" --index-url https://download.pytorch.org/whl/cpu
          pip install litert-torch transformers sentence-transformers
          pip list | grep -iE "torch|litert|quantizer|transformers"
      - name: Çevir
        run: python scripts/models/export_clip.py out
      - name: Sürüme yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete modeller --yes --cleanup-tag || true
          gh release create modeller out/* --target "$GITHUB_SHA" --latest=false \
            --title "Modeller (cümleyle arama)" \
            --notes "OpenAI CLIP ViT-B/32 görüntü kodlayıcısı (MIT) + sentence-transformers/clip-ViT-B-32-multilingual-v1 (Apache-2.0), LiteRT int8. APK derlemesi bunları indirir."
