name: Android APK

on:
  push:
    branches: [ '**', '!ci-screens' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Testler ve debug APK
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Release APK (imzalı)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          ./gradlew assembleRelease

      - name: Hata özetini görünür yap
        if: failure()
        run: |
          python3 - <<'EOF'
          import re
          try:
              lines = open('build.log', errors='ignore').read().splitlines()
          except FileNotFoundError:
              lines = []
          out, block = [], False
          for l in lines:
              if l.startswith('* What went wrong'):
                  block = True
              if l.startswith('* Try:'):
                  block = False
              if block or l.startswith('e: ') or ' error: ' in l or l.startswith('ERROR:'):
                  out.append(l)
          msg = '\n'.join(out[:150]) or '\n'.join(lines[-80:])
          msg = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Derleme hatasi::' + msg)
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gallerypro-apk
          path: app/build/outputs/apk/**/*.apk
